name: PR checks

on:
  pull_request:
    branches: ['PROD_*']

jobs:
  checks:
    name: Quality checks and test build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Content quality checks
        run: python scripts/qa_check.py

      - name: Test build (notebooks are executed)
        run: jupyter-book build resources
